plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = '1.0.0'
group = 'com.npctacz'
base {
    archivesName = 'npc-tacz'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'

    // Local compile-only dependency. Download TACZ yourself and place it at:
    //   mod/libs/tacz.jar
    // Never commit or redistribute this jar.
    compileOnly files('libs/tacz.jar')
    compileOnly 'it.unimi.dsi:fastutil:8.5.9'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'npc_tacz',
            'Specification-Vendor'    : 'npc_tacz',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'npc_tacz'
        ])
    }
}

minecraft {
    runs {
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            jvmArgs '-Dmixin.env.remapRefMap=true'
            mods {
                npc_tacz {
                    source sourceSets.main
                }
            }
        }
    }
}
