plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = '1.1.4'
group = 'com.npctacz'
base {
    archivesName = 'npc-tacz'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

repositories {
    maven { url = uri('file:///D:/mc/.minecraft/libraries') }
    maven { url = uri('local-maven') }
    mavenCentral()
}


dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    // 閹?TACZ 1.2.0 閻?jar 閺€鎯у煂 libs/tacz.jar
    compileOnly files('libs/tacz.jar')
    compileOnly files('libs/fastutil-8.5.9.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'npc_tacz',
            'Specification-Vendor'    : 'npc_tacz',
            'Specification-Version'   : '1.1.4',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'npc_tacz'
        ])
    }
}



minecraft {
    runs {
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            jvmArgs '-Dmixin.env.remapRefMap=true'
            mods {
                npc_tacz {
                    source sourceSets.main
                }
            }
        }
    }
}